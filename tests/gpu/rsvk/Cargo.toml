# SPDX-License-Identifier: MIT
# rsvk: vktri in Rust (ash), the first step of ../9front-ui (PLAN.md stage 1b)
[package]
name = "rsvk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# without "loaded" (dlopen, which 9front lacks) and without "linked" (its build
# script needs a target_family, which plan9 has none of): the entry is
# vkGetInstanceProcAddr of libvulkan.a, handed to Entry::from_static_fn
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }

[profile.release]
debug = true
