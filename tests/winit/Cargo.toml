# SPDX-License-Identifier: MIT
# winit on 9front (../9front-ui PLAN stage 4b): winittest (winit's events,
# softbuffer's pixels in the window), eguitest (egui through egui-winit,
# drawn by hdrshot-egui-backend: egui_software_backend for egui 0.37) and eframetest (eframe on wgpu's Vulkan),
# in a window of wsys or rio. The crates
# with a plan9 backend come from the tree (sys/src/rust/crates), the rest
# from vendor/ (scripts/rust/vendor.sh).
[package]
name = "winittest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4.8", default-features = false }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false }
hdrshot-egui-backend = "0.2.0"
# eframetest: egui's framework on wgpu's Vulkan
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
log = "0.4"

[patch.crates-io]
raw-window-handle = { path = "../../sys/src/rust/crates/raw-window-handle-0.6.2" }
winit = { path = "../../sys/src/rust/crates/winit-0.30.13" }
softbuffer = { path = "../../sys/src/rust/crates/softbuffer-0.4.8" }
wgpu = { path = "../../sys/src/rust/crates/wgpu-30.0.1" }
wgpu-core = { path = "../../sys/src/rust/crates/wgpu-core-30.0.1" }
wgpu-hal = { path = "../../sys/src/rust/crates/wgpu-hal-30.0.1" }

[profile.release]
debug = true
