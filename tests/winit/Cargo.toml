# SPDX-License-Identifier: MIT
# winit on 9front (../9front-ui PLAN stage 4b): winittest (winit's events,
# softbuffer's pixels in the window), eguitest (egui through egui-winit,
# drawn by hdrshot-egui-backend: egui_software_backend for egui 0.37); eframetest
# (eframe on wgpu's Vulkan, on the processor without a GPU) is ../9front-rust's
# (tests/crates/eframetest),
# in a window of wsys or rio. Part of the workspace in sys/src/rust (its
# vendor/, its crates with plan9 backends).
[package]
name = "winittest"
version = "0.1.0"
edition = "2024"
publish = false
workspace = "../../sys/src/rust"

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4.8", default-features = false }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false }
hdrshot-egui-backend = "0.2.0"

