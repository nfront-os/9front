# SPDX-License-Identifier: MIT
# winit on 9front (../9front-ui PLAN stage 4b): winittest (winit's events,
# softbuffer's pixels in the window) and eguitest (egui through egui-winit,
# drawn by egui_software_backend), in a window of wsys or rio. The crates
# with a plan9 backend come from the tree (sys/src/rust/crates), the rest
# from vendor/ (scripts/rust/vendor.sh).
[package]
name = "winittest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4.8", default-features = false }
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }

[patch.crates-io]
raw-window-handle = { path = "../../sys/src/rust/crates/raw-window-handle-0.6.2" }
winit = { path = "../../sys/src/rust/crates/winit-0.30.13" }
softbuffer = { path = "../../sys/src/rust/crates/softbuffer-0.4.8" }

[profile.release]
debug = true
