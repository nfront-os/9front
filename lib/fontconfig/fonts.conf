<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
	fontconfig's configuration on 9front (APE's libfontconfig: sys/src/fontconfig):
	the TrueType fonts of /lib/font/ttf; the cache here (fc-cache as the
	host owner) or in $HOME/.cache/fontconfig; the generic families. A
	user's own in $HOME/.config/fontconfig/fonts.conf.
-->
<fontconfig>
	<dir>/lib/font/ttf</dir>
	<cachedir>/lib/fontconfig/cache</cachedir>
	<cachedir prefix="xdg">fontconfig</cachedir>
	<include ignore_missing="yes" prefix="xdg">fontconfig/fonts.conf</include>

	<alias binding="same">
		<family>sans-serif</family>
		<prefer><family>Fira Sans</family></prefer>
	</alias>
	<alias binding="same">
		<family>serif</family>
		<prefer><family>Fira Sans</family></prefer>
	</alias>
	<alias binding="same">
		<family>monospace</family>
		<prefer><family>Go Mono</family></prefer>
	</alias>

	<match target="font">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="hinting" mode="assign"><bool>true</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
	</match>
</fontconfig>
