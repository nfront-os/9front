# SPDX-License-Identifier: MIT
# term: a terminal for Plan 9's and POSIX programs in a window of wsys or rio
# (draw(3) through p9win: the processor, no GPU needed); its programs on a pty
# of ptyfs(4), the screen kept by the vt100 crate, Go Mono's glyphs by
# ab_glyph. Part of the workspace in sys/src/rust (its vendor/).
[package]
name = "term"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
workspace = "../../rust"

[dependencies]
p9win = { path = "../../rust/plan9/p9win" }
desk = { path = "../../rust/desk" }
vt100 = "0.16"
ab_glyph = "0.2"
unicode-width = "0.2"
